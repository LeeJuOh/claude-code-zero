<!DOCTYPE html>
<html lang="<!-- LANG -->">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- FONT_LINK -->
  <!-- Syntax highlighting: theme-aware highlight.js -->
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark-dimmed.min.css">
  <style>
    /* ===== BASE: Variables ===== */
    :root {
      --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'Azeret Mono', 'SF Mono', Consolas, monospace;
      --bg: #f8f9fa; --surface: #ffffff; --surface-elevated: #ffffff;
      --border: rgba(0,0,0,0.08); --border-bright: rgba(0,0,0,0.15);
      --text: #1a1a2e; --text-dim: #6b7280; --text-muted: #6b7280;
      --accent: #0891b2; --accent-dim: rgba(8,145,178,0.1);
      --node-a: #0891b2; --node-a-dim: rgba(8,145,178,0.1);
      --node-b: #059669; --node-b-dim: rgba(5,150,105,0.1);
      --node-c: #d97706; --node-c-dim: rgba(217,119,6,0.1);
      --success: #16a34a; --warning: #d97706; --danger: #dc2626; --danger-high: #ef4444;
      --info: #0891b2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-hero: 0 8px 32px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.06);
      /* Agent overrides below */
      <!-- CSS_VARIABLES -->
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-elevated: #1c2333;
        --border: rgba(255,255,255,0.06); --border-bright: rgba(255,255,255,0.12);
        --text: #e6edf3; --text-dim: #8b949e; --text-muted: #8b949e;
        --accent: #22d3ee; --accent-dim: rgba(34,211,238,0.12);
        --node-a: #22d3ee; --node-a-dim: rgba(34,211,238,0.12);
        --node-b: #34d399; --node-b-dim: rgba(52,211,153,0.12);
        --node-c: #fbbf24; --node-c-dim: rgba(251,191,36,0.12);
        --success: #34d399; --warning: #fbbf24; --danger: #f87171; --danger-high: #ef4444;
        --info: #22d3ee;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
        --shadow-lg: 0 4px 20px rgba(0,0,0,0.3);
        --shadow-hero: 0 8px 32px rgba(0,0,0,0.4);
        <!-- CSS_VARIABLES_DARK -->
      }
    }

    /* ===== BASE: Typography & Body ===== */
    html { font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    body { margin: 0; padding: 2rem 40px; font-family: var(--font-body); color: var(--text); background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, var(--accent-dim) 0%, transparent 60%); overflow-wrap: break-word; }
    h1, h2, h3, h4 { font-family: var(--font-heading); }
    h1 { font-size: 2rem; letter-spacing: -0.01em; } h2 { font-size: 1.4rem; letter-spacing: -0.01em; } h3 { font-size: 1.1rem; letter-spacing: -0.01em; } h4 { font-size: 0.95rem; letter-spacing: -0.01em; }
    .pull-quote { font-family: var(--font-heading); }
    a { color: var(--accent); text-decoration: underline; } a:hover { color: var(--text); }

    /* ===== LAYOUT: Navigation ===== */
    .wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 170px 1fr; gap: 0 40px; }
    .main { min-width: 0; }
    .toc { position: sticky; top: 24px; align-self: start; padding: 14px 0; grid-row: 1 / -1; max-height: calc(100dvh - 48px); overflow-y: auto; }
    .toc::-webkit-scrollbar { width: 3px; } .toc::-webkit-scrollbar-thumb { background: var(--surface-elevated); border-radius: 2px; }
    .toc-title { font-family: var(--font-mono); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); padding: 0 0 10px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
    .toc a { display: block; font-size: 11px; color: var(--text-dim); text-decoration: none; padding: 4px 8px; border-radius: 5px; border-left: 2px solid transparent; transition: all 0.15s; line-height: 1.4; margin-bottom: 1px; }
    .toc a:hover { color: var(--text); background: var(--accent-dim); }
    .toc a.active { color: var(--text); border-left-color: var(--accent); }

    @media (max-width: 1000px) {
      .wrap { grid-template-columns: 1fr; padding-top: 0; } body { padding-top: 0; }
      .toc { position: sticky; top: 0; z-index: 200; max-height: none; display: flex; gap: 4px; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 0; margin: 0 -40px; padding-left: 40px; padding-right: 40px; grid-row: auto; }
      .toc::-webkit-scrollbar { display: none; } .toc-title { display: none; }
      .toc a { white-space: nowrap; flex-shrink: 0; border-left: none; border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0; padding: 6px 10px; font-size: 10px; }
      .toc a.active { border-left: none; border-bottom-color: var(--accent); background: var(--surface); }
      .main { padding-top: 20px; }
      section[id] { scroll-margin-top: 52px; }
    }

    /* ===== COMPONENTS: Cards ===== */
    .ve-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; position: relative; margin-bottom: 1.5rem; }
    .ve-card--accent-a { border-left: 3px solid var(--node-a); } .ve-card--accent-b { border-left: 3px solid var(--node-b); } .ve-card--accent-c { border-left: 3px solid var(--node-c); }
    .ve-card--hero { background: color-mix(in srgb, var(--surface) 92%, var(--accent) 8%); box-shadow: var(--shadow-hero); border-color: color-mix(in srgb, var(--border) 50%, var(--accent) 50%); }
    .ve-card--elevated { background: var(--surface-elevated); box-shadow: var(--shadow-md); }
    .ve-card--recessed { background: color-mix(in srgb, var(--bg) 70%, var(--surface) 30%); box-shadow: inset 0 1px 3px rgba(0,0,0,0.06); border-color: var(--border); }
    .ve-card--glass { background: color-mix(in srgb, var(--surface) 60%, transparent 40%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-color: rgba(255,255,255,0.1); }
    .ve-card__label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--node-a); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ve-card__label::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    /* ===== COMPONENTS: Code Blocks ===== */
    .code-block { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .code-block--scroll { max-height: 400px; overflow-y: auto; }
    /* Syntax highlighting: override highlight.js backgrounds to use report theme */
    pre code.hljs { background: transparent; padding: 0; }
    .code-block code { display: block; }
    .code-file__body code.hljs { background: transparent; padding: 0; }
    .code-file { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .code-file__header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
    .code-file__body { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; padding: 16px; background: var(--surface-elevated); white-space: pre-wrap; word-break: break-word; max-height: 500px; overflow: auto; }

    /* ===== COMPONENTS: Tables ===== */
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { position: sticky; top: 0; z-index: 1; }
    th { background: var(--surface-elevated); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--border-bright); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 97%, var(--bg) 3%); }
    tr:hover td { background: var(--accent-dim); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ===== COMPONENTS: Status Indicators ===== */
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status--success::before { background: var(--success); } .status--warning::before { background: var(--warning); } .status--danger::before { background: var(--danger); } .status--info::before { background: var(--accent); } .status--neutral::before { background: var(--text-dim); }

    /* ===== COMPONENTS: Comparison Panels ===== */
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .comparison > * { min-width: 0; overflow-wrap: break-word; }
    .comparison__label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .comparison__before .comparison__label { color: var(--danger); } .comparison__after .comparison__label { color: var(--success); }
    .comparison__current .comparison__label { color: var(--node-a); } .comparison__planned .comparison__label { color: var(--node-b); }
    @media (max-width: 768px) { .comparison { grid-template-columns: 1fr; } }

    /* ===== COMPONENTS: Collapsible ===== */
    details.collapsible { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    details.collapsible summary { padding: 12px 16px; cursor: pointer; font-weight: 500; background: var(--surface); border-bottom: 1px solid transparent; transition: background 0.15s; }
    details.collapsible[open] summary { border-bottom-color: var(--border); }
    details.collapsible summary:hover { background: var(--accent-dim); }
    details.collapsible > :not(summary) { padding: 16px; }

    /* ===== COMPONENTS: Prose ===== */
    .lead { font-size: 1.25rem; line-height: 1.6; color: var(--text); opacity: 0.9; max-width: 720px; }
    .pull-quote { font-size: 1.5rem; font-style: italic; line-height: 1.4; border-left: 4px solid var(--accent); padding: 1rem 0 1rem 1.5rem; margin: 2rem 0; color: var(--text); opacity: 0.85; }
    .callout { padding: 1rem 1.25rem; border-radius: 8px; border-left: 4px solid; margin: 1rem 0; }
    .callout--info { border-color: var(--accent); background: var(--accent-dim); }
    .callout--warning { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 8%, var(--surface)); }
    .callout--danger { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }
    .callout__title { font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem; }

    /* ===== OVERFLOW PROTECTION ===== */
    .ve-card > *, .comparison > *, [class*="grid"] > * { min-width: 0; }
    ul { list-style: disc; padding-left: 1.5rem; }
    ol { list-style: decimal; padding-left: 1.5rem; }
    li { margin-bottom: 0.25rem; }

    /* ===== ANIMATION ===== */
    .ve-card, .kpi-card { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: no-preference) { *, *::before, *::after { transition-duration: 0.15s; } }

    /* ===== MERMAID ===== */
    .mermaid-wrap { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; overflow: auto; min-height: 400px; max-height: 80vh; scrollbar-width: thin; scrollbar-color: var(--border) transparent; cursor: grab; text-align: center; }
    .mermaid-wrap::-webkit-scrollbar { width: 6px; height: 6px; } .mermaid-wrap::-webkit-scrollbar-track { background: transparent; } .mermaid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .mermaid-wrap .mermaid { display: inline-block; overflow: visible; }
    .mermaid-wrap .mermaid svg { height: auto; }
    .mermaid .nodeLabel { color: var(--text) !important; font-family: var(--font-body) !important; font-size: 16px !important; }
    .mermaid .edgeLabel { color: var(--text-dim) !important; background-color: var(--bg) !important; font-family: var(--font-mono) !important; font-size: 13px !important; }
    .mermaid .edgeLabel rect { fill: var(--bg) !important; }
    .mermaid .node rect, .mermaid .node circle, .mermaid .node polygon { stroke-width: 1.5px; }
    .mermaid .edge-pattern-solid { stroke-width: 1.5px; }
    .mermaid-wrap--compact { min-height: 200px; } .mermaid-wrap--tall { min-height: 600px; }
    .mermaid-wrap.is-panning { cursor: grabbing; user-select: none; }
    .mermaid-wrap.is-fullscreen { position: fixed; inset: 0; z-index: 1000; border-radius: 0; min-height: 100dvh; }
    .zoom-controls { position: absolute; top: 8px; right: 8px; display: flex; align-items: center; gap: 2px; z-index: 10; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
    .zoom-controls button { width: 28px; height: 28px; border: none; background: transparent; color: var(--text-dim); font-family: var(--font-mono); font-size: 14px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
    .zoom-controls button:hover { background: var(--border); color: var(--text); }
    .zoom-level { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); min-width: 40px; text-align: center; user-select: none; }
    .mermaid .clickable { cursor: pointer; transition: filter 0.2s ease; }
    .mermaid .clickable:hover { filter: brightness(1.15); }

    /* ===== CHART ===== */
    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; position: relative; max-width: 400px; margin: 1.5rem auto; }
    .chart-container canvas { max-height: 300px; }

    /* ===== CONNECTORS ===== */
    .connector-v { display: flex; justify-content: center; padding: 4px 0; } .connector-v svg { width: 2px; height: 40px; }
    .connector-h { display: flex; align-items: center; padding: 0 4px; } .connector-h svg { width: 40px; height: 2px; }
    .connector-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* ===== REPORT: Scope & Hero ===== */
    .scope-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .scope-badge { padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); }
    .scope-badge--critical { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
    .scope-badge--high { background: color-mix(in srgb, var(--danger-high) 12%, var(--surface)); color: var(--danger-high); }
    .scope-badge--medium { background: color-mix(in srgb, var(--warning) 12%, var(--surface)); color: var(--warning); }
    .scope-badge--low { background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: var(--success); }
    .hero-subtitle { font-size: 1rem; opacity: 0.7; margin-top: 0.25rem; }
    .hero-insight { font-size: 1.25rem; line-height: 1.6; opacity: 0.9; max-width: 720px; }

    /* ===== REPORT: Section 1 — Header ===== */
    .meta-table { width: auto; }
    .meta-table td:first-child { font-weight: 600; padding-right: 2rem; white-space: nowrap; }
    .risk-badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 4px; letter-spacing: 0.05em; }
    .risk-badge--critical { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
    .risk-badge--high { background: color-mix(in srgb, var(--danger-high) 15%, transparent); color: var(--danger-high); }
    .risk-badge--medium { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
    .risk-badge--low { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }

    /* ===== REPORT: Section 2 — Overview ===== */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .kpi-card { padding: 1.25rem; border-radius: 12px; text-align: center; }
    .kpi-value { display: block; font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 700; font-family: var(--font-mono); word-break: keep-all; white-space: nowrap; }
    .kpi-label { display: block; font-size: 0.85rem; opacity: 0.7; margin-top: 0.25rem; }
    .kpi-card--success { background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: var(--success); }
    .kpi-card--danger { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
    .kpi-card--info { background: color-mix(in srgb, var(--info) 12%, var(--surface)); color: var(--info); }
    .kpi-card--warning { background: color-mix(in srgb, var(--warning) 12%, var(--surface)); color: var(--warning); }
    .overview-summary { margin-bottom: 1.5rem; }
    .what-how-unique { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
    .whu-item { padding: 0.5rem 0.75rem; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); border-radius: 6px; }
    .feature-list li { margin-bottom: 0.4rem; }
    .pattern-target { margin-top: 1.5rem; padding: 1rem; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); border-radius: 8px; }

    /* ===== REPORT: Section 3 — Architecture ===== */
    .narrative-block { display: flex; flex-direction: column; gap: 1rem; margin: 1.5rem 0; }
    .narrative-item { padding: 1rem 1.25rem; border-radius: 8px; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); }
    .narrative-item h4 { margin: 0 0 0.5rem 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
    .narrative-item p { margin: 0; }
    .narrative-item--thesis { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
    .narrative-item--thesis h4 { color: var(--accent); }
    .philosophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .philosophy-card { padding: 1.25rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .philosophy-card h4 { margin: 0 0 0.5rem 0; color: var(--accent); }
    .philosophy-card p { margin: 0 0 0.5rem 0; font-size: 0.9rem; }
    .philosophy-example { font-size: 0.85rem; color: var(--text-dim); padding-top: 0.5rem; border-top: 1px solid var(--border); margin-top: 0.75rem; }

    /* ===== REPORT: Section 4 — Feature Deep Dive ===== */
    .mechanism-grid { display: flex; flex-direction: column; gap: 1.5rem; margin: 1.5rem 0; }
    .mechanism-card { padding: 1.25rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .mechanism-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .mechanism-number, .mechanism-num { display: none; }
    .mechanism-enables { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 1rem; }
    .mechanism-steps { padding-left: 1.5rem; margin: 0.5rem 0 1rem; }
    .mechanism-steps li { margin-bottom: 0.4rem; padding-left: 0; } .mechanism-steps li::before { content: none; }
    .mechanism-reuse { font-size: 0.9rem; padding: 0.75rem; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-radius: 6px; margin-top: 0.75rem; }
    .why-matters { margin-bottom: 1rem; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--warning) 6%, var(--surface)); border-radius: 6px; border-left: 3px solid var(--warning); }
    .why-matters strong { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--warning); margin-bottom: 0.25rem; }
    .why-matters p { margin: 0; font-size: 0.9rem; }
    .in-practice { margin-top: 0.75rem; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--success) 6%, var(--surface)); border-radius: 6px; border-left: 3px solid var(--success); }
    .in-practice strong { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--success); margin-bottom: 0.25rem; }
    .in-practice p { margin: 0; font-size: 0.9rem; }
    .best-practice { margin-top: 0.5rem; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--info) 6%, var(--surface)); border-radius: 6px; border-left: 3px solid var(--info); }
    .best-practice strong { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--info); margin-bottom: 0.25rem; }
    .best-practice p { margin: 0; font-size: 0.9rem; }
    .workflow-trace { display: flex; flex-direction: column; gap: 0; margin: 1.5rem 0; }
    .trace-step { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .trace-step:last-child { border-bottom: none; }
    .trace-number { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: var(--accent); min-width: 2rem; text-align: center; }
    .trace-content { flex: 1; } .trace-content strong { display: block; margin-bottom: 0.25rem; } .trace-content p { font-size: 0.9rem; color: var(--text-dim); margin: 0 0 0.25rem; }
    .tutorial-scenarios { margin: 1.5rem 0; }
    .tutorial-scenario { margin-bottom: 1.5rem; }
    .tutorial-steps { display: flex; flex-direction: column; gap: 0; margin: 1rem 0; }
    .tutorial-step { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .tutorial-step:last-child { border-bottom: none; }
    .step-user { display: flex; gap: 0.75rem; align-items: baseline; }
    .step-number { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 1.5rem; flex-shrink: 0; }
    .step-user p { margin: 0; }
    .step-hood { font-size: 0.9rem; color: var(--text-dim); padding-left: 2.25rem; margin-top: 0.25rem; }
    .tutorial-tips { margin-top: 1rem; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-radius: 6px; }
    .tutorial-tips strong { display: block; margin-bottom: 0.5rem; }

    /* ===== REPORT: Section 6 — Usage Guide ===== */
    .usage-guidance { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem; }
    @media (max-width: 768px) { .usage-guidance { grid-template-columns: 1fr; } }
    .usage-do { padding: 1rem; border-radius: 8px; border-left: 3px solid var(--success); background: color-mix(in srgb, var(--success) 5%, var(--surface)); }
    .usage-dont { padding: 1rem; border-radius: 8px; border-left: 3px solid var(--danger); background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
    .usage-do h4 { color: var(--success); margin: 0 0 0.5rem 0; } .usage-dont h4 { color: var(--danger); margin: 0 0 0.5rem 0; }

    /* ===== REPORT: Section 7 — Components (Tab UI) ===== */
    .tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; }
    .tab-btn { padding: 0.6rem 1.2rem; border: none; background: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
    .tab-btn:hover { color: var(--text); } .tab-btn--active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; } .tab-panel--active { display: block; }
    .component-card { margin-bottom: 1.5rem; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; }
    .card-essentials h4 { margin: 0 0 0.5rem 0; }
    .source-link { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); text-decoration: none; }
    .source-link:hover { text-decoration: underline; }
    .source-link::after { content: ' \2197'; font-size: 0.7em; }
    .concept-term { border-bottom: 1px dotted var(--text-muted); cursor: help; position: relative; }
    .concept-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--surface-elevated); color: var(--text); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.8rem; max-width: 280px; white-space: normal; box-shadow: var(--shadow-md); z-index: 100; pointer-events: none; }

    /* ===== REPORT: Section 8 — Security Audit ===== */
    .risk-hero { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); border-radius: 8px; }
    .risk-hero .risk-badge { font-size: 1rem; padding: 0.4rem 1rem; }
    .findings-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .finding-card { padding: 1rem 1.25rem; border-radius: 8px; border-left: 4px solid; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); }
    .finding-card--critical { border-color: var(--danger); } .finding-card--high { border-color: var(--danger-high); } .finding-card--medium { border-color: var(--warning); } .finding-card--low { border-color: var(--success); }
    .finding-severity { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .finding-card--critical .finding-severity { color: var(--danger); } .finding-card--high .finding-severity { color: var(--danger-high); } .finding-card--medium .finding-severity { color: var(--warning); } .finding-card--low .finding-severity { color: var(--success); }
    .finding-source { display: block; font-size: 0.75rem; opacity: 0.6; margin-top: 0.5rem; }
    .audit-disclaimer { margin-top: 1.5rem; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--surface) 50%, var(--bg) 50%); border-radius: 6px; font-size: 0.85rem; opacity: 0.8; }

    /* ===== REPORT: Section 5 — Environment Fit Diagnosis ===== */
    .check-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 4px; letter-spacing: 0.05em; }
    .check-badge--pass { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .check-badge--fail { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
    .check-badge--info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
    .risk-badge--recommended { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .risk-badge--ok { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .env-fit-verdict { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: color-mix(in srgb, var(--surface) 60%, var(--bg) 40%); border-radius: 8px; margin-bottom: 1.5rem; }
    .env-fit-verdict p { margin: 0; }
    .env-fit-item { margin: 1rem 0; padding: 0.75rem 1rem; border-left: 3px solid var(--border); }
    .env-fit-item h4 { margin: 0 0 0.5rem 0; font-size: 0.95rem; }
    .env-fit-recommendations { margin: 1rem 0; padding: 0.75rem 1rem; background: color-mix(in srgb, var(--warning) 6%, var(--surface)); border-radius: 8px; }
    .env-fit-recommendations h4 { margin: 0 0 0.5rem 0; font-size: 0.95rem; }
    .env-fit-recommendations ul { margin: 0; padding-left: 1.2rem; }
    .env-fit-note { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.5rem; }

    /* ===== REPORT: Section 11 — Footer ===== */
    .footer-content { text-align: center; font-size: 0.85rem; opacity: 0.7; }
    .footer-content p { margin: 0.25rem 0; }

<script>
/* ===== Tab UI ===== */
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() { var tabId = btn.dataset.tab; btn.closest('section').querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('tab-btn--active'); }); btn.closest('section').querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('tab-panel--active'); }); btn.classList.add('tab-btn--active'); document.getElementById('tab-' + tabId).classList.add('tab-panel--active'); });
});

/* ===== Concept Tooltips ===== */
var conceptDefs = {};
document.querySelectorAll('.concept-term').forEach(function(el) {
  el.addEventListener('mouseenter', function() { var id = el.dataset.concept; var def = conceptDefs[id]; if (!def) return; var tip = document.createElement('div'); tip.className = 'concept-tooltip'; tip.textContent = def; el.appendChild(tip); });
  el.addEventListener('mouseleave', function() { var tip = el.querySelector('.concept-tooltip'); if (tip) tip.remove(); });
});

</script>
